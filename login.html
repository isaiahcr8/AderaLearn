<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — AderaLearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-wrap">

        <div class="auth-card">

            <a href="index.html" class="brand auth-brand">
                <img src="assets/logo.png" alt="AderaLearn Logo" class="logo">
                <span>AderaLearn</span>
            </a>

            <span class="eyebrow">WELCOME BACK</span>

            <h1>Sign in to your account</h1>

            <p class="auth-sub">
                Continue learning where you left off.
            </p>

            <div id="authNotice" class="auth-notice" hidden></div>

            <form id="loginForm" class="auth-form" novalidate>

                <label class="auth-field">
                    <span>Email</span>
                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
                </label>

                <label class="auth-field">
                    <span>Password</span>
                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Your password"
                        required>
                </label>

                <button type="submit" class="btn btn-primary btn-large">
                    Sign in
                </button>

            </form>

            <p class="auth-switch">
                New to AderaLearn?
                <a href="signup.html">Create an account</a>
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth-forms.js"></script>

</body>

</html>
