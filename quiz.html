<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz — AderaLearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>

<body class="quiz-page" data-auth-required>


    <aside class="sidebar">

        <a href="index.html" class="brand">
            <img src="assets/logo.png" alt="AderaLearn Logo" class="logo">
            <span>AderaLearn</span>
        </a>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="sidebar-link">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="lesson.html" class="sidebar-link">
                <span>📚</span>
                Learn
            </a>

            <a href="#" class="sidebar-link">
                <span>▣</span>
                My Lessons
            </a>

            <a href="quiz.html" class="sidebar-link active">
                <span>✓</span>
                Quiz History
            </a>

            <a href="tutor.html" class="sidebar-link">
                <span>✦</span>
                AI Tutor
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="#" class="sidebar-link">
                <span>⚙</span>
                Settings
            </a>

            <a href="index.html" class="sidebar-link">
                <span>↪</span>
                Log Out
            </a>

        </div>

    </aside>



    <main class="quiz-main">


        <header class="dashboard-header">

            <div class="user-profile">

                <div class="avatar">
                    I
                </div>

                <div>
                    <strong>Student</strong>
                    <small>Learning Explorer</small>
                </div>

            </div>

            <button class="notification-btn">
                ♢
                <span></span>
            </button>

        </header>



        <section class="quiz-heading">

            <a href="lesson.html" class="back-link">
                ← Back to Lesson
            </a>

            <span class="eyebrow">
                QUICK QUIZ
            </span>

            <h1 id="quizTopic">
                Your Topic
            </h1>

            <p>
                Answer the questions below to test what you learned.
            </p>

        </section>



        <section class="quiz-container">

            <div class="quiz-progress-top">

                <div>
                    <span id="questionNumber">
                        Question 1 of 5
                    </span>

                    <strong id="quizScore">
                        Score: 0
                    </strong>
                </div>

                <div class="quiz-progress-bar">
                    <div id="quizProgress"></div>
                </div>

            </div>



            <div class="question-card">

                <span class="question-label">
                    QUESTION 1
                </span>

                <h2 id="questionText">
                    Which statement best describes this topic?
                </h2>


                <div class="answer-options">

                    <button class="answer-option">
                        <span>A</span>
                        Answer option one
                    </button>

                    <button class="answer-option">
                        <span>B</span>
                        Answer option two
                    </button>

                    <button class="answer-option">
                        <span>C</span>
                        Answer option three
                    </button>

                    <button class="answer-option">
                        <span>D</span>
                        Answer option four
                    </button>

                </div>

            </div>



            <div class="quiz-actions">

                <button id="previousQuestion" class="quiz-secondary-btn">
                    ← Previous
                </button>

                <button id="nextQuestion" class="btn btn-primary">
                    Next Question →
                </button>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
