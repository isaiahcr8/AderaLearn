<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result — AderaLearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>

<body data-auth-required>

    <aside class="sidebar">

        <a href="index.html" class="brand">
            <img src="assets/logo.png" alt="AderaLearn Logo" class="logo">
            <span>AderaLearn</span>
        </a>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="sidebar-link">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="lesson.html" class="sidebar-link">
                <span>📚</span>
                Learn
            </a>

            <a href="#" class="sidebar-link">
                <span>▣</span>
                My Lessons
            </a>

            <a href="quiz.html" class="sidebar-link active">
                <span>✓</span>
                Quiz History
            </a>

            <a href="tutor.html" class="sidebar-link">
                <span>✦</span>
                AI Tutor
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="#" class="sidebar-link">
                <span>⚙</span>
                Settings
            </a>

            <a href="index.html" class="sidebar-link">
                <span>↪</span>
                Log Out
            </a>

        </div>

    </aside>


    <main class="result-main">

        <header class="dashboard-header">

            <div class="user-profile">

                <div class="avatar">
                    I
                </div>

                <div>
                    <strong>Student</strong>
                    <small>Learning Explorer</small>
                </div>

            </div>

            <button class="notification-btn">
                ♢
                <span></span>
            </button>

        </header>


        <section class="result-section">

            <div class="result-card">

                <span class="eyebrow">
                    QUIZ COMPLETE
                </span>

                <h1 id="resultMessage">
                    Great job! 🎉
                </h1>

                <p id="resultTopic">
                    You completed the quiz.
                </p>

                <div class="score-circle">

                    <strong id="resultPercentage">
                        0%
                    </strong>

                    <span>
                        Your Score
                    </span>

                </div>

                <h2 id="resultScore">
                    0 / 5
                </h2>

                <p id="resultFeedback">
                    Keep learning and improving.
                </p>

                <section id="quizReview" class="quiz-review"></section>

                <div class="result-actions">

                    <a href="quiz.html" class="quiz-secondary-btn">
                        Try Again
                    </a>

                    <a href="dashboard.html" class="btn btn-primary">
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
