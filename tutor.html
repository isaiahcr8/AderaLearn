<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Tutor — AderaLearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="tutor-page" data-auth-required>

    <aside class="sidebar">

        <a href="index.html" class="brand">
            <img src="assets/logo.png" alt="AderaLearn Logo" class="logo">
            <span>AderaLearn</span>
        </a>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="sidebar-link">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="lesson.html" class="sidebar-link">
                <span>📚</span>
                Learn
            </a>

            <a href="#" class="sidebar-link">
                <span>▣</span>
                My Lessons
            </a>

            <a href="quiz.html" class="sidebar-link">
                <span>✓</span>
                Quiz History
            </a>

            <a href="tutor.html" class="sidebar-link active">
                <span>✦</span>
                AI Tutor
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="#" class="sidebar-link">
                <span>⚙</span>
                Settings
            </a>

            <a href="index.html" class="sidebar-link">
                <span>↪</span>
                Log Out
            </a>

        </div>

    </aside>


    <main class="tutor-main">

        <header class="dashboard-header">

            <div class="user-profile">

                <div class="avatar">
                    I
                </div>

                <div>
                    <strong>Student</strong>
                    <small>Learning Explorer</small>
                </div>

            </div>

            <button class="notification-btn">
                ♢
                <span></span>
            </button>

        </header>


        <section class="tutor-heading">

            <a href="dashboard.html" class="back-link">
                ← Back to Dashboard
            </a>

            <span class="eyebrow">AI TUTOR</span>

            <h1>Ask AderaLearn AI</h1>

            <div class="tutor-topic-chip">
                ✦ Currently discussing:
                <strong id="chipTopic">General learning</strong>
            </div>

        </section>


        <div class="tutor-layout">

            <section class="conversation-panel">

                <div class="conversation-panel-head">
                    <strong>Conversations</strong>

                    <button type="button" id="newChatBtn" class="new-chat-btn">
                        + New Chat
                    </button>
                </div>

                <div class="conversation-list" id="conversationList"></div>

            </section>


            <section class="chat-panel">

                <div class="chat-panel-top">

                    <div class="chat-panel-topic">

                        <div class="ai-small-icon">✦</div>

                        <div>
                            <strong id="tutorTopicName">General learning</strong>
                            <small id="tutorTopicSub">AI Tutor</small>
                        </div>

                    </div>

                    <button type="button" id="clearChatBtn" class="clear-chat-btn">
                        🗑 Clear Chat
                    </button>

                </div>


                <div class="chat-messages" id="chatMessages"></div>


                <div class="suggested-questions" id="suggestedQuestions">
                    <button type="button">Explain this simply</button>
                    <button type="button">Give me an example</button>
                    <button type="button">Quiz me on this</button>
                </div>


                <form class="chat-input" id="chatForm">

                    <input
                        type="text"
                        id="questionInput"
                        placeholder="Ask anything about your topic..."
                        autocomplete="off">

                    <button type="submit">→</button>

                </form>

            </section>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/tutor.js"></script>

</body>

</html>
